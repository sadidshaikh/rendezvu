name: Deploy signaling to Fly.io (manual)

# For moving to Fly.io later (signaling/fly.toml). The server runs on Render's
# free plan for now, which deploys itself from render.yaml on every push, so
# this only runs when started by hand from the Actions tab.
on:
  workflow_dispatch:

# Never two deploys at once: the second would restart the machine mid-deploy.
concurrency:
  group: deploy-signaling
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # One machine, always: rooms live in its memory.
      - run: flyctl deploy . --config signaling/fly.toml --dockerfile signaling/Dockerfile --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
